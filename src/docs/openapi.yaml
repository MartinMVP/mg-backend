openapi: 3.0.3
info:
  title: Enlace Ganadero API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK

  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  access: { type: string }

  /catalog/breeds:
    get:
      summary: List breeds
      responses: { '200': { description: OK } }
    post:
      summary: Create breed (admin/super)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name: { type: string }
                code: { type: string }
      responses: { '201': { description: Created } }

  /catalog/registries:
    get:
      summary: List registries
      responses: { '200': { description: OK } }
    post:
      summary: Create registry (admin/super)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, authority]
              properties:
                name: { type: string }
                authority: { type: string }
                country: { type: string }
      responses: { '201': { description: Created } }

  /catalog/animals:
    get:
      summary: List animals
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: breed
          schema: { type: string }
        - in: query
          name: sex
          schema: { type: string, enum: [M, F] }
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: minAge
          schema: { type: integer }
        - in: query
          name: maxAge
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses: { '200': { description: OK } }
    post:
      summary: Create animal
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag, breed, sex, location]
              properties:
                tag: { type: string }
                breed: { type: string }
                sex: { type: string, enum: [M, F] }
                name: { type: string }
                location:
                  type: object
                  required: [state]
                  properties:
                    state: { type: string }
                    municipality: { type: string }
      responses: { '201': { description: Created } }

  /catalog/animals/{id}:
    get:
      summary: Get animal
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
    patch:
      summary: Update animal (owner/admin/super)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: OK }
    delete:
      summary: Soft delete animal (owner/admin/super)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }

  /catalog/listings:
    get:
      summary: List listings (published)
      parameters:
        - in: query
          name: breed
          schema: { type: string }
        - in: query
          name: sex
          schema: { type: string, enum: [M, F] }
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: minPrice
          schema: { type: number }
        - in: query
          name: maxPrice
          schema: { type: number }
        - in: query
          name: featured
          schema: { type: boolean }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses: { '200': { description: OK } }
    post:
      summary: Create listing draft
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [animal, price]
              properties:
                animal: { type: string }
                animalId: { type: string }
                title: { type: string }
                description: { type: string }
                price: { type: number }
                isNegotiable: { type: boolean }
                media:
                  type: array
                  items: { type: string }
      responses:
        '201': { description: Created }

  /catalog/listings/{id}:
    get:
      summary: Get listing
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
    patch:
      summary: Update listing (owner/admin/super)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: OK }
    delete:
      summary: Delete listing (owner/admin/super)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }

  /catalog/listings/{id}/publish:
    patch:
      summary: Publish listing draft and consume membership listing slot
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Published or already published }
        '409': { description: Membership limit reached or listing cannot publish }

  /catalog/listings/{id}/archive:
    patch:
      summary: Archive listing and release membership listing slot when published
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Archived or already archived }
  /api/media:
    post:
      summary: Upload image or document
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201': { description: Created }
        '400': { description: Invalid file / too large }

  # ===== Subastas (Sprint 3) =====

  /auctions:
    get:
      summary: List auctions
      responses:
        '200': { description: OK }
    post:
      summary: Create auction
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, listing, startsAt, endsAt, startPrice, minIncrement]
              properties:
                title: { type: string }
                listing: { type: string, description: "Listing ID" }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
                startPrice: { type: number }
                minIncrement: { type: number }
      responses:
        '201': { description: Created }

  /auctions/{id}:
    get:
      summary: Get auction
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }

  /auctions/{id}/open:
    post:
      summary: Open auction (scheduled → live)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '409': { description: Invalid state }

  /auctions/{id}/pause:
    post:
      summary: Pause auction (live → paused)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '409': { description: Invalid state }

  /auctions/{id}/resume:
    post:
      summary: Resume auction (paused → live)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '409': { description: Invalid state }

  /auctions/{id}/close:
    post:
      summary: Close auction (live/paused → closed)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '409': { description: Invalid state }

  /auctions/{id}/bid:
    post:
      summary: Place bid (HTTP fallback)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, minimum: 0 }
      responses:
        '200': { description: Accepted }
        '400': { description: Too low }
        '409': { description: Not live / race condition }



  /membership/plans:
    get:
      summary: List membership plans (admin/super)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
    post:
      summary: Create membership plan (admin/super)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
                description: { type: string }
                monthlyPrice: { type: number }
                yearlyPrice: { type: number }
                durationDays: { type: integer }
                benefits: { type: object }
                limits: { type: object }
      responses: { '201': { description: Created } }

  /membership/plans/{id}:
    patch:
      summary: Update, activate, or deactivate membership plan (admin/super)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses: { '200': { description: OK } }

  /memberships:
    get:
      summary: List memberships (admin/super)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
    post:
      summary: Create membership pending administrative activation (admin/super)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, planId]
              properties:
                userId: { type: string }
                planId: { type: string }
                startsAt: { type: string, format: date-time }
                metadata: { type: object }
      responses: { '201': { description: Created } }

  /memberships/{id}:
    get:
      summary: Get membership with benefits and history (admin/super)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses: { '200': { description: OK } }

  /memberships/{id}/activate:
    patch:
      summary: Activate membership administratively (admin/super)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses: { '200': { description: OK } }

  /memberships/{id}/suspend:
    patch:
      summary: Suspend membership (admin/super)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses: { '200': { description: OK } }

  /memberships/{id}/reactivate:
    patch:
      summary: Reactivate suspended membership (admin/super)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses: { '200': { description: OK } }

  /memberships/{id}/cancel:
    patch:
      summary: Cancel membership (admin/super)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses: { '200': { description: OK } }

  /memberships/{id}/expire:
    patch:
      summary: Expire membership (admin/super)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses: { '200': { description: OK } }

  /memberships/{id}/history:
    get:
      summary: Get membership history (admin/super)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses: { '200': { description: OK } }

  /membership/checkout:
    post:
      summary: Create Stripe Sandbox checkout for membership purchase
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planId: { type: string }
                planCode: { type: string }
      responses:
        '201': { description: Checkout created }
        '409': { description: Active membership or Stripe configuration error }

  /memberships/current:
    get:
      summary: Get current membership for authenticated user
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }

  /memberships/current/benefits:
    get:
      summary: Get current membership benefits for authenticated user
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }

  /payments/webhook/stripe:
    post:
      summary: Stripe webhook for membership purchase payments
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Processed or duplicate ignored }
        '400': { description: Invalid signature or event }
        '422': { description: Unprocessable event }

  /payments/{id}:
    get:
      summary: Get own membership payment transaction
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }

  /admin/payments:
    get:
      summary: List membership payment transactions (admin/super)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }

  /admin/payments/{id}:
    get:
      summary: Get membership payment transaction (admin/super)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /fiscal/memberships/invoice:
    post:
      summary: Request membership CFDI invoice
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionId]
              properties:
                transactionId: { type: string }
      responses:
        '201': { description: Invoice issued or queued }
        '202': { description: Invoice failed but recoverable }
        '404': { description: Payment transaction not found }

  /fiscal/memberships/invoice/{id}:
    get:
      summary: Get membership invoice
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Invoice }
        '404': { description: Not found }

  /fiscal/memberships/history:
    get:
      summary: List membership fiscal history
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Fiscal history }

  /fiscal/memberships/invoice/{id}/cancel:
    post:
      summary: Request membership invoice cancellation
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Cancelled }
        '409': { description: Invoice not issued }
        '422': { description: Provider cancellation error }

  /admin/fiscal/invoices:
    get:
      summary: Admin list fiscal platform and membership invoices
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Invoices }

  /admin/fiscal/invoices/{id}:
    get:
      summary: Admin get membership fiscal invoice
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Invoice }
        '404': { description: Not found }

  /admin/fiscal/failed:
    get:
      summary: Admin list failed membership fiscal invoices
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Failed invoices }

  /admin/fiscal/reprocess/{id}:
    post:
      summary: Admin reprocess membership fiscal invoice
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Reprocessed }
        '202': { description: Still failed but recoverable }
        '409': { description: Invoice not reprocessable }

  /messages/conversations:
    post:
      summary: Create a listing conversation with the seller
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listingId]
              properties:
                listingId: { type: string }
      responses:
        '201': { description: Conversation created }
        '200': { description: Existing active conversation reused }
        '400': { description: Invalid listing request }
        '403': { description: Membership or authorization denied }
        '404': { description: Listing not found }
    get:
      summary: List authenticated user's listing conversations
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200': { description: Conversation list }

  /messages/conversations/{id}:
    get:
      summary: Get a listing conversation and immutable message history
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200': { description: Conversation detail }
        '403': { description: Participant required }
        '404': { description: Conversation not found }

  /messages/conversations/{id}/messages:
    post:
      summary: Send an immutable message in a listing conversation
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                metadata: { type: object }
      responses:
        '201': { description: Message sent }
        '400': { description: Message body required }
        '403': { description: Participant required }
        '404': { description: Conversation not found }

  /messages/conversations/{id}/archive:
    patch:
      summary: Archive a listing conversation
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Conversation archived }
        '403': { description: Participant required }
        '404': { description: Conversation not found }

  /messages/conversations/{id}/close:
    patch:
      summary: Close a listing conversation
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Conversation closed }
        '403': { description: Participant required }
        '404': { description: Conversation not found }

  /payments/operations:
    post:
      summary: Create a commercial operation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operationType, referenceType, referenceId, amount]
              properties:
                operationType: { type: string, enum: [membership, featured_listing, advertising, sponsorship, auction_fee, service] }
                referenceType: { type: string }
                referenceId: { type: string }
                amount: { type: number }
                currency: { type: string, default: MXN }
                metadata: { type: object }
      responses:
        '201': { description: Commercial operation created }
        '400': { description: Invalid operation }
        '409': { description: Operation type not enabled }

  /payments/operations/{id}:
    get:
      summary: Get a commercial operation
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Commercial operation }
        '404': { description: Operation not found }

  /payments/checkout:
    post:
      summary: Create a Revenue-owned payment intent and checkout
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operationId]
              properties:
                operationId: { type: string }
      responses:
        '201': { description: Payment intent created }
        '404': { description: Operation not found }
        '409': { description: Operation is not payable }

  /payments/webhook:
    post:
      summary: Process a signed provider webhook through Revenue
      parameters:
        - in: header
          name: x-payment-signature
          required: true
          schema: { type: string }
      responses:
        '200': { description: Webhook processed or duplicate ignored }
        '400': { description: Signature or payload invalid }

  /payments/transactions:
    get:
      summary: List Revenue payment transactions
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Transactions }

  /payments/refunds:
    post:
      summary: Execute a business-approved refund through Revenue
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operationId]
              properties:
                operationId: { type: string }
                amount: { type: number }
                reason: { type: string }
      responses:
        '201': { description: Refund processed }
        '409': { description: Refund rejected by operation state }

  /admin/payments/reconcile:
    post:
      summary: Execute Revenue reconciliation
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Reconciliation completed }

  /admin/payments/reconciliation:
    get:
      summary: List Revenue reconciliation records
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Reconciliation records }

  /fiscal/operations:
    post:
      summary: Create a FiscalOperation from a settled commercial operation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commercialOperationId]
              properties:
                commercialOperationId: { type: string }
                provider: { type: string, enum: [mock, facturama, future], default: mock }
                metadata: { type: object }
      responses:
        '201': { description: Fiscal operation created and invoice emission attempted }
        '200': { description: Existing fiscal operation reused }
        '409': { description: PaymentSettled is required }

  /fiscal/operations/{id}:
    get:
      summary: Get a FiscalOperation
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Fiscal operation }
        '404': { description: Fiscal operation not found }

  /fiscal/history/{operationId}:
    get:
      summary: Get reproducible fiscal history by FiscalOperation or CommercialOperation id
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: operationId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Fiscal operation history }
        '404': { description: Fiscal history not found }

