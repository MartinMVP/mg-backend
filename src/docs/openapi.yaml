openapi: 3.0.3
info:
  title: Enlace Ganadero API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK

  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  access: { type: string }

  /catalog/breeds:
    get:
      summary: List breeds
      responses: { '200': { description: OK } }
    post:
      summary: Create breed (admin/super)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name: { type: string }
                code: { type: string }
      responses: { '201': { description: Created } }

  /catalog/registries:
    get:
      summary: List registries
      responses: { '200': { description: OK } }
    post:
      summary: Create registry (admin/super)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, authority]
              properties:
                name: { type: string }
                authority: { type: string }
                country: { type: string }
      responses: { '201': { description: Created } }

  /catalog/animals:
    get:
      summary: List animals
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: breed
          schema: { type: string }
        - in: query
          name: sex
          schema: { type: string, enum: [M, F] }
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: minAge
          schema: { type: integer }
        - in: query
          name: maxAge
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses: { '200': { description: OK } }
    post:
      summary: Create animal
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag, breed, sex, location]
              properties:
                tag: { type: string }
                breed: { type: string }
                sex: { type: string, enum: [M, F] }
                name: { type: string }
                location:
                  type: object
                  required: [state]
                  properties:
                    state: { type: string }
                    municipality: { type: string }
      responses: { '201': { description: Created } }

  /catalog/animals/{id}:
    get:
      summary: Get animal
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
    patch:
      summary: Update animal (owner/admin/super)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: OK }
    delete:
      summary: Soft delete animal (owner/admin/super)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }

  /catalog/listings:
    get:
      summary: List listings (published)
      parameters:
        - in: query
          name: breed
          schema: { type: string }
        - in: query
          name: sex
          schema: { type: string, enum: [M, F] }
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: minPrice
          schema: { type: number }
        - in: query
          name: maxPrice
          schema: { type: number }
        - in: query
          name: featured
          schema: { type: boolean }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses: { '200': { description: OK } }
    post:
      summary: Create listing
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [animal, price]
              properties:
                animal: { type: string }
                price: { type: number }
                isNegotiable: { type: boolean }
      responses:
        '201': { description: Created }

  /catalog/listings/{id}:
    get:
      summary: Get listing
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
    patch:
      summary: Update listing (owner/admin/super)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: OK }
    delete:
      summary: Delete listing (owner/admin/super)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }

  /api/media:
    post:
      summary: Upload image
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201': { description: Created }
        '400': { description: Invalid file / too large }

  # ===== Subastas (Sprint 3) =====

  /auctions:
    get:
      summary: List auctions
      responses:
        '200': { description: OK }
    post:
      summary: Create auction
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, listing, startsAt, endsAt, startPrice, minIncrement]
              properties:
                title: { type: string }
                listing: { type: string, description: "Listing ID" }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
                startPrice: { type: number }
                minIncrement: { type: number }
      responses:
        '201': { description: Created }

  /auctions/{id}:
    get:
      summary: Get auction
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }

  /auctions/{id}/open:
    post:
      summary: Open auction (scheduled → live)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '409': { description: Invalid state }

  /auctions/{id}/pause:
    post:
      summary: Pause auction (live → paused)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '409': { description: Invalid state }

  /auctions/{id}/resume:
    post:
      summary: Resume auction (paused → live)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '409': { description: Invalid state }

  /auctions/{id}/close:
    post:
      summary: Close auction (live/paused → closed)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '409': { description: Invalid state }

  /auctions/{id}/bid:
    post:
      summary: Place bid (HTTP fallback)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, minimum: 0 }
      responses:
        '200': { description: Accepted }
        '400': { description: Too low }
        '409': { description: Not live / race condition }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

